name: Release Multi-Platform Binaries

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-binaries:
        runs-on: ${{ matrix.runner }}
        strategy:
            matrix:
                include:
                    - runner: macos-latest
                      target: bun-darwin-arm64
                      artifact: december-aarch64-apple-darwin
                      archive_type: tar.gz
                      bin_name: december

                    - runner: macos-13
                      target: bun-darwin-x64
                      artifact: december-x86_64-apple-darwin
                      archive_type: tar.gz
                      bin_name: december

                    - runner: ubuntu-latest
                      target: bun-linux-x64
                      artifact: december-x86_64-unknown-linux-gnu
                      archive_type: tar.gz
                      bin_name: december

                    - runner: ubuntu-latest
                      target: bun-linux-arm64
                      artifact: december-aarch64-unknown-linux-gnu
                      archive_type: tar.gz
                      bin_name: december

                    - runner: windows-latest
                      target: bun-windows-x64
                      artifact: december-x86_64-pc-windows-msvc
                      archive_type: zip
                      bin_name: december.exe

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Compile Bun Binary (macOS & Linux)
              if: runner.os != 'Windows'
              run: |
                  cd apps/cli
                  bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile=./december
                  tar -czvf ../../${{ matrix.artifact }}.tar.gz december

            - name: Compile Bun Binary (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  cd apps/cli
                  bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile=./december.exe
                  Compress-Archive -Path december.exe -DestinationPath ../../${{ matrix.artifact }}.zip

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.artifact }}.*

    publish-release:
        needs: build-binaries
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  path: release-artifacts
                  merge-multiple: true

            - name: Attach binaries to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-artifacts/*.tar.gz
                      release-artifacts/*.zip
                  generate_release_notes: true
