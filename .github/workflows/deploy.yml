name: Deploy to EC2

on:
    push:
        branches:
            - main
        paths:
            - 'apps/server/**'
            - 'apps/worker/**'
            - 'packages/**'
            - 'Dockerfile'
            - 'docker-compose.yml'
            - '.github/workflows/deploy.yml'
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    build-and-push:
        name: Build & Push Images (GHCR)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & Push db-migrate image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: base
                  push: true
                  tags: ghcr.io/phasehumans/december-db-migrate:latest
                  cache-from: type=gha,scope=db-migrate
                  cache-to: type=gha,mode=max,scope=db-migrate

            - name: Build & Push server image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: server
                  push: true
                  tags: ghcr.io/phasehumans/december-server:latest
                  cache-from: type=gha,scope=server
                  cache-to: type=gha,mode=max,scope=server

            - name: Build & Push worker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: worker
                  push: true
                  tags: ghcr.io/phasehumans/december-worker:latest
                  cache-from: type=gha,scope=worker
                  cache-to: type=gha,mode=max,scope=worker

    deploy:
        name: Deploy to EC2
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to EC2 over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER || 'ubuntu' }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  port: 22
                  script_stop: true
                  script: |
                      echo "==> Pulling latest changes from main branch..."
                      cd /var/www/december
                      git sparse-checkout set --no-cone '/docker-compose.yml'
                      git pull origin main

                      echo "==> Pulling pre-built images from GHCR..."
                      sudo docker compose pull

                      echo "==> Restarting Docker containers..."
                      sudo docker compose up -d --remove-orphans

                      echo "==> Cleaning up unused Docker images and build cache..."
                      sudo docker image prune -f
                      sudo docker builder prune -f --keep-storage=1GB

                      echo "==> Verifying local health check..."
                      sleep 5
                      curl -f http://127.0.0.1:4000/health || exit 1
                      echo "==> Backend containers deployed successfully!"

            - name: Verify Public HTTPS Healthcheck
              run: |
                  echo "==> Verifying public HTTPS API health..."
                  curl -f --retry 5 --retry-delay 3 https://api.trydecember.com/health
                  echo "==> Production API is live and healthy!"
