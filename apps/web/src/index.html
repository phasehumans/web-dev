        <style>
            html,
            body,
            #root {
                background-color: #141414;
                color: #e8e8e6;
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
            }
            @keyframes pulse-loader {
                0%,
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.35;
                    transform: scale(0.98);
                }
            }
            .initial-loader {
                display: flex;
                height: 100%;
                width: 100%;
                align-items: center;
                justify-content: center;
                background-color: #141414;
                user-select: none;
            }
            .initial-loader-logo {
                width: 48px;
                height: 48px;
                color: #3a3a3a;
                animation: pulse-loader 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
        </style>
